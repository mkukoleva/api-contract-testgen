name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Обычный CI использует сохранённые наборы тестов и НЕ вызывает генерацию
# через LLM: нигде не создаётся .env, не заполняются ключи и не запускается
# конвейер генерации. Все тестовые шаги идут через tools/verify.py
# (uv run --project prototype --locked --no-sync), поэтому повторные запуски
# не устанавливают зависимости.

jobs:
  # Быстрый гейт: юнит-тесты проекта без Docker и стенда (offline-режим).
  unit:
    name: Unit tests (offline, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: prototype/.python-version
      - name: Install uv
        run: python -m pip install uv
      - name: Sync environment (once)
        working-directory: prototype
        run: uv sync --locked
      - name: Run verify (offline)
        run: uv run --project prototype --locked --no-sync python tools/verify.py --offline --skip-runner-set
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-reports
          path: .verify-runs
          if-no-files-found: warn

  # Полный прогон: сборка runner-образа, стенд Catalogue, юнит-тесты с
  # интеграционными флагами и сохранённые наборы через runner (service-режим).
  saved-sets:
    name: Saved sets via runner (stand, no LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: prototype/.python-version
      - name: Install uv
        run: python -m pip install uv
      - name: Sync environment (once)
        working-directory: prototype
        run: uv sync --locked
      - name: Build runner image
        run: docker build -t api-contract-pytest-runner:step5 prototype/src/prototype/service_tools/runner
      - name: "Run verify (full: stand, tests, saved sets, reports, teardown)"
        run: uv run --project prototype --locked --no-sync python tools/verify.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-full-reports
          path: .verify-runs
          if-no-files-found: warn
