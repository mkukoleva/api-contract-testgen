name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: prototype/.python-version
      - run: python -m pip install uv
      - run: uv sync --locked
      - run: uv run --locked python -m pytest src/prototype/tests -q
