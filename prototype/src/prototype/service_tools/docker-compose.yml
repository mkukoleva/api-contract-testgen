services:
  schematesis:
    build:
      context: ./schematesis
      dockerfile: DockerFile
    image: schemathesis-svc
    container_name: schemathesis-svc
    ports:
      - "127.0.0.1:${SCHEMATHESIS_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      ALLOW_LOCAL_SCHEMAS: "${ALLOW_LOCAL_SCHEMAS:-0}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
