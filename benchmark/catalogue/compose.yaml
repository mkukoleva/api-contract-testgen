name: pytest-runner-catalogue

services:
  catalogue:
    image: weaveworksdemos/catalogue:0.3.5@sha256:0147a65b7116569439eefb1a6dbed455fe022464ef70e0c3cab75bc4a226b39b
    platform: linux/amd64
    command: ["/app", "-port=8080"]
    ports:
      - "127.0.0.1:${CATALOGUE_PORT:-9911}:8080"
    depends_on:
      catalogue-db:
        condition: service_healthy
    networks:
      - api
      - database
      - host-access
    read_only: true
    cap_drop: [ALL]
    # /app carries cap_net_bind_service+ep; removing it from the bounding set
    # prevents exec even when the configured HTTP port is above 1024.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    mem_limit: 256m
    pids_limit: 128

  catalogue-db:
    image: weaveworksdemos/catalogue-db:0.3.0@sha256:7ba74ec9adf88f6625b8d85d3323d1ee5232b39877e1590021ea485cf9457251
    platform: linux/amd64
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: socksdb
    volumes:
      - catalogue-data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 40
    mem_limit: 512m
    pids_limit: 256

networks:
  # Docker needs a non-internal network to publish the localhost port.
  # This is for the stand's API only; never attach the test runner here.
  host-access:
    driver: bridge
  api:
    internal: true
  database:
    internal: true

volumes:
  catalogue-data:
